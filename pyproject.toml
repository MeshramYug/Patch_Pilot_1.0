[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-pilot"
version = "0.1.0"
description = "Autonomous multi-agent code reviewer, vulnerability detector, and self-healing test synthesizer."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PatchPilot Team"}
]
keywords = ["ai", "agents", "code-review", "self-healing", "llm", "pytest", "ast", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[project.scripts]
patch-pilot = "patch_pilot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["patch_pilot*"]
